@if (hasPermission) {
<div class="table-container">
  <!-- <div class="table-title">Tạo Yêu Cầu Nhập Nguyên Vật Liệu</div> -->
  <div class="table-title">Danh sách yêu cầu NVL(Chờ duyệt)</div>

  <div class="search-header">
    <form nz-form [formGroup]="searchForm">

      <div nz-row [nzGutter]="20">

        <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Phòng ban</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="department" nzAllowClear nzPlaceHolder="Chọn phòng ban">
                <nz-option nzValue="CAB1" nzLabel="CAB1"></nz-option>
                <nz-option nzValue="CAB2" nzLabel="CAB2"></nz-option>
                <nz-option nzValue="CAB3" nzLabel="CAB3"></nz-option>
                <nz-option nzValue="BOX" nzLabel="BOX"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Từ Ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker formControlName="fromDate" nzMode="date" nzFormat="yyyy-MM-dd" nzPlaceHolder="Từ ngày">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Đến ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker formControlName="toDate" nzMode="date" nzFormat="yyyy-MM-dd" nzPlaceHolder="Đến ngày">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>


        <nz-space>
          <button nz-button nzType="primary" (click)="getData()">
            <span nz-icon nzType="search"></span>
            Search
          </button>

        </nz-space>

      </div>

    </form>
  </div>
  <div>

  </div>

  <div class="grid-title">
    <!-- Danh sách NVL cần order theo mã Z -->


    <ag-grid-angular class="ag-theme-alpine seov-grid" style="width: 100%; height: 500px" [columnDefs]="columnDefs"
      (gridReady)="onGridReady($event)" [rowHeight]="42" [context]="{ componentParent: this }">
    </ag-grid-angular>

  </div>

</div>


} @else {

<app-no-permission></app-no-permission>

}
