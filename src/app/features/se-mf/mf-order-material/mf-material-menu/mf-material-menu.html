<div class="menu-container">

    <div class="menu-header">
        <h2>MF Management</h2>
        <span>Factory Control System</span>
    </div>

    <div class="menu-grid">

        <button nz-button nzType="default" class="menu-btn master_file" (click)="createRequest()">
            <span nz-icon nzType="edit"></span>
            Tạo phiếu yêu cầu NVL
        </button>

        <button nz-button nzType="default" class="menu-btn setting-btn" (click)="createRequestAn()" >
            <app-icon name="edit" [size]="33"></app-icon>
            Tạo phiếu yêu cầu NVL(Theo "AN")
        </button>

        <button nz-button nzType="default" class="menu-btn aproval-btn" (click)="aprovalRequest()">
            <!-- <span nz-icon nzType="form"></span> -->
            <app-icon name="ClipboardCheck" [size]="33"></app-icon>
            Phê duyệt yêu cầu
        </button>

        <button nz-button nzType="default" class="menu-btn report-btn" (click)="createRequestList()">
            <span nz-icon nzType="bar-chart"></span>
            Danh sách yêu cầu NVL
        </button>

        <button nz-button nzType="default" class="menu-btn trace-btn" (click)="hisRequest()">
            <span nz-icon nzType="search"></span>
            Tra cứu lịch sử
        </button>


    </div>

</div>
