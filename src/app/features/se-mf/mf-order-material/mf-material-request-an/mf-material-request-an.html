<div class="table-container">
  <!-- <div class="table-title">Tạo Yêu Cầu Nhập Nguyên Vật Liệu</div> -->

  <div class="search-header">
    <form nz-form [formGroup]="searchForm">

      <div nz-row [nzGutter]="16">

        <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Phòng ban</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="department" nzAllowClear nzPlaceHolder="Chọn phòng ban">
                <nz-option nzValue="CAB1" nzLabel="CAB1"></nz-option>
                <nz-option nzValue="CAB2" nzLabel="CAB2"></nz-option>
                <nz-option nzValue="CAB3" nzLabel="CAB3"></nz-option>
                <nz-option nzValue="BOX" nzLabel="BOX"></nz-option>
                <nz-option nzValue="TRN" nzLabel="TRN"></nz-option>
                <nz-option nzValue="QA" nzLabel="QA"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col nzSpan="4">
          <nz-form-item>
            <nz-form-label [nzRequired]="true">Ngày cần</nz-form-label>
            <nz-form-control>
              <nz-date-picker formControlName="date" [nzShowTime]="{ nzFormat: 'HH:mm' }" nzFormat="yyyy-MM-dd HH:mm"
                nzPlaceHolder="Chọn ngày giờ">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col nzSpan="5">
          <nz-form-item>
            <nz-form-label>Ghi chú</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="remark" placeholder="Ghi chú phiếu order" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <nz-space>
          <button nz-button nzType="primary" (click)="getMaterial()">
            <span nz-icon nzType="search"></span>
            Search
          </button>

          <button nz-button nzType="primary" (click)="createOrder()">
            <span nz-icon nzType="file-add"></span>
            Tạo Order
          </button>
        </nz-space>

      </div>

    </form>
  </div>
  <div>

  </div>

  <!-- table product -->
  <div class="toolbar" nz-row [nzGutter]="24" style="margin-bottom: 3px;">
    <div nz-col nzSpan="4" class="deleteRow">
      <button nz-button nzType="default" type="button" (click)="removeProductRows()">
        <span nz-icon nzType="delete"></span>
        Xóa mã "AN" đã chọn
      </button>

    </div>
    <div nz-col nzSpan="3" class="checkboxItem">

      <button nz-button nzType="primary" type="button" nz-popconfirm (click)="addItem()">
        <span nz-icon nzType="plus"></span>
        Thêm Item
      </button>
    </div>



  </div>

  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 300px" [columnDefs]="productColumn"
    [rowData]="productRowData" [rowSelection]="rowSelection" (gridReady)="onPrGridReady($event)" [rowHeight]="42">
  </ag-grid-angular>







  <!-- table material detail -->
  <div class="toolbar" [formGroup]="rvForm" nz-row [nzGutter]="24" style="margin-bottom: 3px; margin-top: 30px;">
    <div nz-col nzSpan="3" class="deleteRow">
      <button nz-button nzType="default" type="button" (click)="removeSelectedRows()">
        <span nz-icon nzType="delete"></span>
        Xóa NVL đã chọn
      </button>

    </div>
    <div nz-col nzSpan="15" class="checkboxItem">
      <div class="material-info">
        <span nz-icon nzType="info-circle"></span>
        <span>Thông tin nguyên vật liệu</span>
      </div>
    </div>
    <!-- <div nz-col nzSpan="3" class="checkboxItem">

      <button nz-button nzType="primary" type="button" nz-popconfirm (click)="addItem()"
        [disabled]="searchForm.get('zCode')?.value?.length > 0">
        <span nz-icon nzType="plus"></span>
        Thêm Item
      </button>
    </div> -->

    <!-- <div nz-col nzSpan="5" class="product_info">

      <span>{{ product_code }}</span>
      <input nz-input placeholder="Nhập SL sản xuất" [value]="qtyRequest" type="number" #qtyInput
        (keyup.enter)="onEnter(+qtyInput.value)" />
    </div> -->



  </div>

  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 750px" [columnDefs]="columnDefs"
    [rowData]="rowData" [rowSelection]="rowSelection" (gridReady)="onGridReady($event)" [rowHeight]="42">
  </ag-grid-angular>



  <nz-modal [nzWidth]="1200" [nzBodyStyle]="{
    height: '350px',
    overflow: 'auto'}" [(nzVisible)]="isUpdateModalVisible" nzTitle="Lựa chọn nguyên vật liệu tiêu hao"
    (nzOnCancel)="updateHandleCancel()" (nzOnOk)="updateHandleOk()">

    <ng-container *nzModalContent>
      <div style="margin-bottom: 8px;">Chọn mã nguyên vật liệu:</div>
      <nz-select style="width: 90%;" class="roles-select" [(ngModel)]="selectedPrIds" nzMode="multiple" nzShowSearch
        nzAllowClear [nzMaxTagCount]="25" nzPlaceHolder="Vui lòng chọn mã nguyên vật liệu...">

        <nz-option *ngFor="let consumption of Consumptions" [nzValue]="consumption.item_code"
          [nzLabel]="consumption.item_code + '-' + consumption.item_namee">
        </nz-option>

      </nz-select>
      <ng-template>Khác</ng-template>
    </ng-container>
  </nz-modal>




</div>
