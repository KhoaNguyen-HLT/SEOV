<div class="table-container">

  <!-- SEARCH AREA -->
  <div class="search-header">
    <!-- filter sau này đặt vào đây -->
  </div>

  <!-- TITLE -->
  <div class="grid-title">
    Danh sách NVL cần order theo mã Z
  </div>

  <!-- GRID -->
  <ag-grid-angular
    class="ag-theme-alpine seov-grid"
    style="width: 100%; height: 500px"
    [columnDefs]="columnDefs"
    (gridReady)="onGridReady($event)"
    [rowHeight]="42">
  </ag-grid-angular>

  <!-- ACTION BAR -->
  <div class="action-bar">

    <div class="action-left">
      <!-- sau này có thể show total rows / status -->
      <span class="info-text">
        <!-- Tổng: {{ rowData?.length || 0 }} dòng -->
      </span>
    </div>

    <div class="action-right">

      <button nz-button nzType="primary" (click)="saveData()">
        <span nz-icon nzType="save"></span>
        Save
      </button>

      <button nz-button nzType="default" nzDanger>
        Hủy Request
      </button>

    </div>

  </div>

</div>
