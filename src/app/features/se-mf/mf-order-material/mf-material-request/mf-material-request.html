<div class="table-container">
  <div class="table-title">Tạo Request Nhập Nguyên Vật Liệu</div>
  <!-- 🔍 HEADER SEARCH -->
  <div class="search-header">
    <form nz-form [formGroup]="searchForm">

      <div nz-row [nzGutter]="16">

        <!-- Line -->
        <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Phòng ban</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="department" nzAllowClear nzPlaceHolder="Chọn phòng ban">
                <nz-option nzValue="CAB1" nzLabel="CAB1"></nz-option>
                <nz-option nzValue="CAB2" nzLabel="CAB2"></nz-option>
                <nz-option nzValue="CAB3" nzLabel="CAB3"></nz-option>
                <nz-option nzValue="BOX" nzLabel="BOX"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Ngày đến -->
        <div nz-col nzSpan="3">
          <nz-form-item class="form-item">
            <nz-form-label>Ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker formControlName="date" nzMode="date" nzFormat="yyyy-MM-dd" nzPlaceHolder="Chọn ngày">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col nzSpan="6">
          <nz-form-item>
            <nz-form-label>Mã Z</nz-form-label>
            <nz-form-control>
              <nz-select nzMode="multiple" formControlName="zCode" nzPlaceHolder="Chọn mã Z">
                <nz-option *ngFor="let r of zCode" [nzValue]="r.id" [nzLabel]="r.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Keyword -->
        <!-- <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Từ khóa</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="keyword" placeholder="Tìm thiết bị, lỗi..." />
            </nz-form-control>
          </nz-form-item>
        </div> -->

        <!-- Button -->
        <div nz-col nzSpan="2">
          <button nz-button nzType="primary" htmlType="submit" (click)="getData()">Search</button>
        </div>

      </div>

    </form>
  </div>
  
  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 500px" [columnDefs]="columnDefs"
    [rowData]="rowData" (gridReady)="onGridReady($event)" [context]="{ componentParent: this }" [rowHeight]="42">
  </ag-grid-angular>

  <!-- <nz-modal [(nzVisible)]="isVisibleDetail" nzTitle="Chi tiết báo cáo" (nzOnCancel)="handleCancel()"
    [nzFooter]="footerTemplate">
    <ng-template #footerTemplate>
      <button nz-button nzType="primary" (click)="handleCancel()">
        Đóng
      </button>
    </ng-template>
    <div>
      Nội dung chi tiết báo cáo
    </div>
  </nz-modal> -->











</div>
