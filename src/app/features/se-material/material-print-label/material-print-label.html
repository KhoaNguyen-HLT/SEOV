<nz-card class="label-form-card" nzTitle="">
  <form nz-form [formGroup]="generateForm" nzLayout="vertical">
    <div class="generate-form">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Nguyên vật liệu</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="materialName">
            <nz-option nzLabel="Material A" nzValue="MaterialA"></nz-option>
            <nz-option nzLabel="Material B" nzValue="MaterialB"></nz-option>
            <nz-option nzLabel="Material C" nzValue="MaterialC"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Tổng số lượng</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="totalQty" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Số lượng tem</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="labelQty" />
        </nz-form-control>
      </nz-form-item>

      <!-- Date -->
      <nz-form-item>
        <nz-form-label>Date</nz-form-label>
        <nz-form-control>
          <nz-date-picker formControlName="dateTime"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
      <div class="action-buttons">
        <button nz-button class="btn-generate" (click)="generateLot()">Generate LotNo</button>
        <button nz-button class="btn-save" (click)="saveData()" *ngIf="btn_save">Save</button>
        <button nz-button class="btn-preview" (click)="previewLabel()" *ngIf="btn_preview">Preview</button>
      </div>
    </div>

  </form>
</nz-card>
<div>
  <ag-grid-angular
  class="ag-theme-quartz"
  style="width: 100%; height: 500px;"
  [rowData]="rowData"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [pagination]="true"
  [paginationPageSize]="20">
</ag-grid-angular>
</div>

<nz-modal [(nzVisible)]="isVisible" (nzOnCancel)="handleCancel()" [nzFooter]="footerTpl" [nzWidth]="'90%'">
  <ng-container *nzModalContent>
    <div class="modal-scroll-body">
      <div id="label-print-area">
        <div class="label-grid">
          <div class="label" *ngFor="let label of rowData">
            <div class="title">SEI OPTIFRONTIER Vietnam</div>
            <div><b>Name:</b> {{ label.materialName }}</div>
            <div><b>Lot:</b> {{ label.lotNo }}</div>

            <div class="content">
              <div class="info">
                <div><b>Code:</b> {{ label.materialCode }}</div>
                <div><b>Qty:</b> {{ label.qty }} {{ label.uom }}</div>
                <div>
                  <b style="font-weight: 800; font-size: 20px"> {{ label.date }}</b>
                </div>
              </div>

              <div class="qr">
                <img [src]="getQrUrl(label.lotNo)" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #footerTpl>
    <button nz-button (click)="handleCancel()">Đóng</button>

    <button nz-button nzType="primary" ngxPrint printSectionId="label-print-area" [useExistingCss]="true"
      (click)="handleCancel()">
      In tem
    </button>
  </ng-template>
</nz-modal>
