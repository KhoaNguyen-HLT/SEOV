
<nz-card class="label-form-card" nzTitle="In tem NVL">
  <form nz-form [formGroup]="labelForm" nzLayout="vertical">

    <div class="form-grid">
      <nz-form-item>
        <nz-form-label>Material Code</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="materialCode" placeholder="VD: NVL001" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Lot No</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="lotNo" placeholder="VD: LOT20260526" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Total Qty</nz-form-label>
        <nz-form-control>
          <input nz-input type="number" formControlName="qty" placeholder="1000" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>UOM</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="uom">
            <nz-option nzValue="PCS" nzLabel="PCS"></nz-option>
            <nz-option nzValue="M" nzLabel="M"></nz-option>
            <nz-option nzValue="KG" nzLabel="KG"></nz-option>
            <nz-option nzValue="BOX" nzLabel="BOX"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Location</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="location" placeholder="VD: WH-A1" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Số tem cần in</nz-form-label>
        <nz-form-control>
          <input nz-input type="number" formControlName="printQty" placeholder="10" />
        </nz-form-control>
      </nz-form-item>
    </div>

    <div class="label-preview-box">
      <div>
        <div class="preview-title">Label Code</div>
        <div class="preview-code">
          {{ labelForm.get('labelCode')?.value}}
        </div>
      </div>

      <button nz-button nzType="default" (click)="previewLabel()">
        Preview
      </button>
    </div>

  </form>
</nz-card>

<nz-modal
  [(nzVisible)]="isVisible"
  (nzOnCancel)="handleCancel()"
>
  <ng-container *nzModalContent>
    <div id="label-print-area">
      <div class="label-grid">
        <div class="label" *ngFor="let label of labels">
          <div class="title">MATERIAL LABEL</div>

          <div class="content">
            <div class="info">
              <div><b>Material:</b> {{ label.materialCode }}</div>
              <div><b>Lot:</b> {{ label.lotNo }}</div>
              <div><b>Qty:</b> {{ label.qty }} {{ label.uom }}</div>
              <div><b>Location:</b> {{ label.location }}</div>
            </div>

            <div class="qr">
              <img [src]="getQrUrl(label.lotNo)" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <button
      nz-button
      nzType="primary"
      ngxPrint
      printSectionId="label-print-area"
      [useExistingCss]="true"
    >
      In tem
    </button>
  </ng-container>
</nz-modal>
