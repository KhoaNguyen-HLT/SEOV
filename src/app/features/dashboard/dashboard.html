<div class="dashboard-container">

    <div class="dashboard">

        <!-- Header -->
        <div class="dashboard-header">

            <div>
                <h2>Material Dashboard</h2>
                <span>Material Order Statistics</span>
            </div>

            <div class="dashboard-filter">

                <nz-date-picker nzMode="month"></nz-date-picker>

                <nz-select style="width:180px">
                    <nz-option nzLabel="All Supplier" nzValue=""></nz-option>
                </nz-select>

                <button nz-button nzType="primary">
                    Refresh
                </button>

            </div>

        </div>

        <!-- KPI -->
        <div class="kpi-grid">

            <!-- <app-kpi-card></app-kpi-card>
            <app-kpi-card></app-kpi-card>
            <app-kpi-card></app-kpi-card>
            <app-kpi-card></app-kpi-card>
            <app-kpi-card></app-kpi-card>
            <app-kpi-card></app-kpi-card> -->


        </div>

        <!-- Row 1 -->
        <div class="chart-row">

            <nz-card class="chart-card large">
                <div nz-row>
                    <div nz-col nzSpan="12">

                        <div class="dashboard-card">
                            <div echarts [options]="chartOption" class="chart"></div>
                        </div>

                    </div>
                    <div nz-col nzSpan="12"></div>
                </div>

            </nz-card>

            <nz-card class="chart-card small">

                <div echarts class="chart">aaaaa</div>

            </nz-card>

        </div>

        <!-- Row 2 -->
        <div class="chart-row">

            <nz-card class="chart-card">

                <div echarts class="chart"></div>

            </nz-card>

            <nz-card class="chart-card">

                <div echarts class="chart"></div>

            </nz-card>

        </div>

        <!-- Row 3 -->
        <div class="chart-row">

            <nz-card class="chart-card">

                <div echarts class="chart"></div>

            </nz-card>

            <nz-card class="chart-card">

                <div echarts class="chart"></div>

            </nz-card>

        </div>

    </div>
