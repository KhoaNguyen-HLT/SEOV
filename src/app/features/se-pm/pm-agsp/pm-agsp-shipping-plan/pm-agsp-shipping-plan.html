<div class="table-container">
  <div class="table-title">SHIPPING PLAN</div>
  <!-- 🔍 HEADER SEARCH -->
  <div class="search-header">
    <form nz-form [formGroup]="searchForm">

      <div nz-row [nzGutter]="16">

        <!-- Line -->
        <div nz-col nzSpan="6">
          <nz-form-item class="form-item">
            <nz-form-label>Supplier</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="supplier" nzAllowClear nzPlaceHolder="Chọn nhà cung cấp">
                <nz-option nzValue="1" nzLabel="Nhà cung cấp 1"></nz-option>
                <nz-option nzValue="2" nzLabel="Nhà cung cấp 2"></nz-option>
                <nz-option nzValue="3" nzLabel="Nhà cung cấp 3"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Ngày đến -->
        <div nz-col nzSpan="6">
          <nz-form-item class="form-item">
            <nz-form-label>Chọn Ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker formControlName="date" nzMode="date" nzFormat="yyyy-MM-dd"
                nzPlaceHolder="Chọn tháng cập nhật">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Keyword -->
        <!-- <div nz-col nzSpan="4">
          <nz-form-item class="form-item">
            <nz-form-label>Từ khóa</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="keyword" placeholder="Tìm thiết bị, lỗi..." />
            </nz-form-control>
          </nz-form-item>
        </div> -->

        <!-- Button -->

        <div nz-col nzSpan="4">
          <button nz-button nzType="primary" (click) = "generateShippingPlan()">Tạo kế hoạch giao hàng</button>
        </div>
        <div nz-col nzSpan="2">
          <button nz-button nzType="primary" (click) = "getShippingPlanData()" >Search</button>
        </div>

        <!-- <div nz-col nzSpan="3">
          <button nz-button nzType="primary" >Update Tồn đầu</button>
        </div> -->

      </div>

    </form>
  </div>

  <button nz-button nzType="primary" (click)="exportExcel()">Excel</button>
  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 600px" [columnDefs]="columnDefs"
    [enableCellTextSelection]="true" [rowData]="rowData" (gridReady)="onGridReady($event)">
  </ag-grid-angular>

        Đóng
      </button>
    </ng-template>
    <div>
      Nội dung chi tiết báo cáo
    </div>
  </nz-modal> -->











</div>
