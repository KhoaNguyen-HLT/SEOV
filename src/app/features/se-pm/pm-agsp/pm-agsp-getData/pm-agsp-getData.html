<div class="page">
    <div class="card">

        <form [formGroup]="form">
            <div class="card-header">
                <div class="header-info">
                    <h2>Import Demand, Inventory Data</h2>
                    <p>Chọn file Excel để hệ thống đọc và xử lý</p>
                </div>
                <div nz-col nzSpan="6" class="header-select">
                    <nz-form-control>
                        <nz-select formControlName="fileName" nzAllowClear nzPlaceHolder="Chọn loại File">
                            <nz-option nzValue="DEMAND" nzLabel="Demand File"></nz-option>
                            <nz-option nzValue="IVT" nzLabel="Inventory"></nz-option>
                        </nz-select>
                    </nz-form-control>
                </div>

                <div class="header-action">
                    <nz-date-picker formControlName="month" nzMode="month" nzFormat="yyyy-MM"
                        nzPlaceHolder="Chọn tháng cập nhật">
                    </nz-date-picker>

                    <button nz-button nzType="primary" nzSize="large" (click)=" upload()">
                        Xử lý file
                    </button>
                </div>
            </div>
        </form>

        <div class="upload-box">
            <nz-upload nzType="drag" [nzMultiple]="false" [nzBeforeUpload]="beforeUpload" [nzShowUploadList]="false"
                accept=".xlsx,.xls">

                <p class="upload-icon">
                    <span nz-icon nzType="inbox"></span>
                </p>

                <p class="upload-title">Kéo thả file Excel vào đây</p>
                <p class="upload-desc">Hoặc bấm để chọn file từ máy tính</p>

            </nz-upload>
        </div>

        <div class="file-list" *ngIf="selectedFiles.length > 0">
            <div class="file-item">
                <div class="file-left">
                    <div class="file-stt">1</div>
                    <div class="file-icon">📄</div>

                    <div>
                        <div class="file-name">
                            {{ selectedFiles[0].name }}
                        </div>

                        <div class="file-size">
                            {{ formatFileSize(selectedFiles[0].size) }}
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
