<div class="filter-container">

  <form nz-form [formGroup]="searchForm" (ngSubmit)="onSearch()">

    <div nz-row [nzGutter]="12" class="filter-row">

      <!-- Home -->
      <div nz-col [nzXs]="12" [nzSm]="12" [nzMd]="1" [nzLg]="0.2">
        <button nz-button nzType="primary" nzSize="large" class="home-btn" (click)="goToHomePage()">
          <span nz-icon nzType="home"></span>
        </button>
      </div>

      <!-- Line -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="4">
        <nz-select formControlName="line" nzAllowClear nzSize="large" nzPlaceHolder="Select Line" class="full-width">
          <nz-option nzValue="1" nzLabel="Line 1"></nz-option>
          <nz-option nzValue="2" nzLabel="Line 2"></nz-option>
          <nz-option nzValue="3" nzLabel="Line 3"></nz-option>
          <nz-option nzValue="4" nzLabel="Line 4"></nz-option>
          <nz-option nzValue="5" nzLabel="Line 5"></nz-option>
        </nz-select>
      </div>

      <!-- Status -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="4">
        <nz-select formControlName="status" nzAllowClear nzSize="large" nzPlaceHolder="Select Status"
          class="full-width">
          <nz-option nzValue="WAITING" nzLabel="Waiting"></nz-option>
          <nz-option nzValue="PROCESSING" nzLabel="Processing"></nz-option>
          <nz-option nzValue="DONE" nzLabel="Done"></nz-option>
        </nz-select>
      </div>

      <!-- From Date -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="4">
        <nz-date-picker formControlName="fromDate" nzSize="large" nzFormat="yyyy-MM-dd" nzPlaceHolder="From Date"
          class="full-width">
        </nz-date-picker>
      </div>

      <!-- To Date -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="4">
        <nz-date-picker formControlName="toDate" nzSize="large" nzFormat="yyyy-MM-dd" nzPlaceHolder="To Date"
          class="full-width">
        </nz-date-picker>
      </div>

      <!-- Search -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="3">
        <button nz-button nzType="primary" nzSize="large" htmlType="submit" class="full-width search-btn">
          <span nz-icon nzType="search"></span>
          Search
        </button>
      </div>
    </div>
  </form>

</div>
<div class="dashboard-container">

  <div nz-col [nzSpan]="24">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
        <div class="dashboard-card">
          <div echarts [options]="chartOption" class="chart"></div>
        </div>
      </div>
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
        <div class="dashboard-card">
          <div echarts [options]="chartOption1" class="chart"></div>
        </div>
      </div>
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
        <div class="dashboard-card">
          <div echarts [options]="chartOption2" class="chart"></div>
        </div>
      </div>
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
        <div class="dashboard-card">
          <div echarts [options]="chartOption3" class="chart"></div>

        </div>
      </div>
    </div>
  </div>
</div>
