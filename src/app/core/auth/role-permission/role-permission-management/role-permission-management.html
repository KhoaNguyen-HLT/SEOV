<ag-grid-angular class="ag-theme-alpine seov-grid" style="width: 100%; height: 500px" [columnDefs]="columnDefs"
  (gridReady)="onGridReady($event)" [rowHeight]="42" [context]="{ componentParent: this }">
</ag-grid-angular>

<nz-modal [(nzVisible)]="isUpdateModalVisible" nzTitle="Cập Nhật Vai Trò Người Dùng" (nzOnCancel)="updateHandleCancel()"
  (nzOnOk)="updateHandleOk()">

  <ng-container *nzModalContent>
    <div style="margin-bottom: 8px;">Người dùng: <strong></strong></div>

    <div style="margin-bottom: 8px;">Chọn Vai Trò (Multiple Roles):</div>
    <nz-select class="roles-select" [(ngModel)]="selectedPermissionIds" [nzMaxTagCount]="5" nzMode="multiple"
      nzPlaceHolder="Vui lòng chọn vai trò...">

      <nz-option *ngFor="let permission of permission" [nzValue]="permission.id" [nzLabel]="permission.code">
      </nz-option>

    </nz-select>
    <ng-template>và vai trò khác</ng-template>
  </ng-container>
</nz-modal>
