<div class="title">Danh sách vai trò trong hệ thống</div>

<div class="header-actions">
  <button nz-button nzType="primary" class = "add_btn"  (click)="showCreateModal()">
    <span nz-icon nzType="plus"></span> Thêm Vai Trò Mới
  </button>
</div>


<ag-grid-angular class="ag-theme-alpine seov-grid" style="width: 100%; height: 500px" [columnDefs]="columnDefs"
  (gridReady)="onGridReady($event)" [rowHeight]="42" [context]="{ componentParent: this }">
</ag-grid-angular>


<nz-modal [(nzVisible)]="isEditModalVisible" nzTitle="Sửa thiết bị" (nzOnCancel)="editHandleCancel()" (nzOnOk)="editHandleOk()">
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="editForm">
      <nz-form-item>
        <nz-form-label nzSpan="6">Code</nz-form-label>
        <nz-form-control nzSpan="18">
          <input nz-input formControlName="code" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzSpan="6">name</nz-form-label>
        <nz-form-control nzSpan="18">
          <input nz-input formControlName="name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzSpan="6">Description</nz-form-label>
        <nz-form-control nzSpan="18">
          <input nz-input formControlName="description" />
        </nz-form-control>
      </nz-form-item>

    </form>
  </ng-container>
</nz-modal>


<nz-modal [(nzVisible)]="isModalVisible"
  (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">

  <ng-container *nzModalContent>
    <form nz-form [formGroup]="createForm">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Mã vai trò</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Vui lòng nhập mã vai trò!">
          <input nz-input formControlName="code" id="code" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Tên Vai Trò</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Vui lòng nhập tên vai trò!">
          <input nz-input formControlName="name" id="name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="description">Mô tả</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <textarea nz-input formControlName="description" id="description"
            [nzAutosize]="{ minRows: 2, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
