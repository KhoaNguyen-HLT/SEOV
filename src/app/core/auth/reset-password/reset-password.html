<div class="reset-page">
  <div class="reset-card">

    <div class="reset-header">
      <div class="icon-box">
        <app-icon name="key" [size]="30"></app-icon>
        <h2>Reset Password</h2>
      </div>


      <p>Nhập thông tin để đặt lại mật khẩu người dùng</p>
    </div>

    <form nz-form [formGroup]="form" class="reset-form">

      <nz-form-item>
        <nz-form-label nzRequired>User</nz-form-label>

        <nz-form-control nzErrorTip="Vui lòng chọn người dùng">
          <nz-select formControlName="username" nzPlaceHolder="Chọn người dùng" nzShowSearch nzAllowClear>

            <nz-option *ngFor="let user of users" [nzLabel]="user.name + ' (' + user.username + ')'"
              [nzValue]="user.username">
            </nz-option>

          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div class="action-row">
        <button nz-button nzType="default" type="button" (click)="goBack()">
          Quay lại
        </button>

        <button nz-button nzType="primary" type="button" [nzLoading]="loading" (click)="handleReset()">
          Reset Password
        </button>
      </div>

    </form>

  </div>
</div>
