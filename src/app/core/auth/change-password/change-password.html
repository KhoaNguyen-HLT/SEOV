<div class="reset-page">
  <div class="reset-card">

    <div class="reset-header">
      <div class="icon-box">
        <app-icon name="key" [size]="30"></app-icon>
        <h2>Đổi Mật Khẩu</h2>
      </div>

      
      <p>Nhập thông tin để đổi mật khẩu người dùng</p>
    </div>

    <form nz-form [formGroup]="form" class="reset-form">

      <nz-form-item>
        <nz-form-label nzRequired>Username</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập username">
          <input nz-input formControlName="username" placeholder="Nhập username" readonly/>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Mật khẩu cũ</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu cũ">
          <nz-input-group>
            <input
              nz-input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="oldPassword"
              placeholder="Nhập mật khẩu cũ" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Mật khẩu mới</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu tối thiểu 8 ký tự">
          <nz-input-group>
            <input
              nz-input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Nhập mật khẩu mới" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Xác nhận mật khẩu</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu xác nhận không hợp lệ">
          <input
            nz-input
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Nhập lại mật khẩu" />
        </nz-form-control>
      </nz-form-item>

      <div class="action-row">
        <button nz-button nzType="default" type="button" (click)="goBack()">
          Quay lại
        </button>

        <button
          nz-button
          nzType="primary"
          type="button"
          [nzLoading]="loading"
          (click)="handleReset()">
          Reset Password
        </button>
      </div>

    </form>

  </div>
</div>
